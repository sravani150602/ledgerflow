<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t"><title id="t">Order workflow</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker></defs><rect width="1200" height="580" rx="18" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Asynchronous Order Fulfillment</text><g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M230 125h120"/><path d="M545 125h125"/><path d="M865 125h140"/><path d="M1075 180v75"/><path d="M1000 310H870"/><path d="M680 310H545"/><path d="M450 365v65"/><path d="M450 365c0 40 340 25 340 65"/></g><g font-family="Arial" text-anchor="middle"><g><rect x="50" y="75" width="180" height="100" rx="14" fill="#0ea5e9"/><text x="140" y="117" fill="white" font-size="19" font-weight="700">1. POST order</text><text x="140" y="147" fill="#e0f2fe" font-size="14">validated JSON</text></g><g><rect x="350" y="75" width="195" height="100" rx="14" fill="#16a34a"/><text x="447" y="116" fill="white" font-size="19" font-weight="700">2. Save PENDING</text><text x="447" y="147" fill="#dcfce7" font-size="14">database transaction</text></g><g><rect x="670" y="75" width="195" height="100" rx="14" fill="#334155"/><text x="767" y="116" fill="white" font-size="19" font-weight="700">3. Commit</text><text x="767" y="147" fill="#e2e8f0" font-size="14">durable + visible</text></g><g><rect x="1005" y="75" width="145" height="105" rx="14" fill="#111827"/><text x="1077" y="116" fill="white" font-size="19" font-weight="700">4. Kafka</text><text x="1077" y="147" fill="#d1d5db" font-size="14">order.created</text></g><g><rect x="870" y="255" width="205" height="110" rx="14" fill="#7c3aed"/><text x="972" y="298" fill="white" font-size="19" font-weight="700">5. Consumer</text><text x="972" y="328" fill="#ede9fe" font-size="14">group lines + lock rows</text></g><g><rect x="350" y="255" width="195" height="110" rx="14" fill="#f59e0b"/><text x="447" y="298" fill="white" font-size="19" font-weight="700">6. Check stock</text><text x="447" y="328" fill="#fffbeb" font-size="14">all-or-nothing</text></g><g><rect x="335" y="430" width="225" height="95" rx="14" fill="#16a34a"/><text x="447" y="471" fill="white" font-size="20" font-weight="700">CONFIRMED</text><text x="447" y="500" fill="#dcfce7" font-size="14">stock reserved</text></g><g><rect x="680" y="430" width="220" height="95" rx="14" fill="#dc2626"/><text x="790" y="471" fill="white" font-size="20" font-weight="700">REJECTED</text><text x="790" y="500" fill="#fee2e2" font-size="14">stock unchanged</text></g></g><text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Duplicate delivery safely no-ops after the order leaves PENDING</text></svg>
